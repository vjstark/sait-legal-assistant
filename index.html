<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virat Joshi — Fall 2026 Schedule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0d8;
      --border-strong: #c8c5bb;
      --text-primary: #1a1916;
      --text-secondary: #6b6860;
      --text-muted: #9e9b93;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --accent-text: #1d4ed8;
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --warning-bg: #fffbeb;
      --warning-text: #92400e;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --border: #2e2d2a;
        --border-strong: #3d3c38;
        --text-primary: #f0ede6;
        --text-secondary: #9e9b93;
        --text-muted: #6b6860;
        --accent: #3b82f6;
        --accent-bg: #1e3a5f;
        --accent-text: #93c5fd;
        --success-bg: #052e16;
        --success-text: #86efac;
        --warning-bg: #1c1400;
        --warning-text: #fcd34d;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stat span {
      font-weight: 500;
      color: var(--text-primary);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      font-family: inherit;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .pill.active {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: var(--border-strong); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }

    .card-code {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }

    .badge-inperson { background: var(--success-bg); color: var(--success-text); }
    .badge-online   { background: var(--accent-bg);  color: var(--accent-text); }
    .badge-async    { background: var(--warning-bg);  color: var(--warning-text); }

    .divider { height: 1px; background: var(--border); }

    .detail {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .detail i { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .times { display: flex; flex-direction: column; gap: 4px; }

    .time-chip {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--text-primary);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
      header h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Virat Joshi — Fall 2026</h1>
    <p>Southern Alberta Institute of Technology &middot; Sep 1 – Dec 17, 2026</p>
    <div class="stats">
      <div class="stat"><i class="ti ti-book"></i><span id="total-count">8</span> classes registered</div>
      <div class="stat"><i class="ti ti-map-pin"></i><span>3</span> in person</div>
      <div class="stat"><i class="ti ti-wifi"></i><span>2</span> online sync</div>
      <div class="stat"><i class="ti ti-clock-pause"></i><span>3</span> asynchronous</div>
    </div>
  </header>

  <div class="filters">
    <button class="pill active" onclick="filter('all', this)">All classes</button>
    <button class="pill" onclick="filter('inperson', this)">In person</button>
    <button class="pill" onclick="filter('online', this)">Online sync</button>
    <button class="pill" onclick="filter('async', this)">Asynchronous</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const courses = [
  {
    title: "Introduction to Law",
    code: "Legal 200 · Section A · CRN 21437",
    type: "inperson",
    instructor: "Penelope Hamilton",
    room: "Stan Grad Centre MB211 / MB023",
    dates: "Sep 1 – Dec 17, 2026",
    sessions: [
      { days: "T/Th", time: "2:00 – 4:50 PM" },
      { days: "T/Th", time: "8:00 – 9:50 AM" }
    ]
  },
  {
    title: "Corporate Law",
    code: "Legal 210 · Section A · CRN 21441",
    type: "inperson",
    instructor: "Kyle Meema",
    room: "Stan Grad Centre MB021 / MD308",
    dates: "Sep 1 – Dec 17, 2026",
    sessions: [
      { days: "M/W", time: "11:00 AM – 12:50 PM" },
      { days: "M/W", time: "8:00 – 9:50 AM" }
    ]
  },
  {
    title: "Grammar and Proofreading",
    code: "English 205 · Section D · CRN 21066",
    type: "inperson",
    instructor: "Suzanne Chomery",
    room: "Stan Grad Centre MB304 / MB023",
    dates: "Sep 1 – Dec 17, 2026",
    sessions: [
      { days: "M/W", time: "2:00 – 3:50 PM" }
    ]
  },
  {
    title: "Keyboard Skill Building",
    code: "Legal 205 · Section A",
    type: "online",
    instructor: "Jamie Larkam",
    room: "Online · ONLINE45",
    dates: "Sep 1 – Dec 17, 2026",
    sessions: [
      { days: "M/W/F", time: "10:00 – 10:50 AM" },
      { days: "T/Th", time: "9:00 – 9:50 AM" }
    ]
  },
  {
    title: "Legal Computer Applications I",
    code: "Legal 215 · Section A · CRN 21428",
    type: "inperson",
    instructor: "Lindsay Savage",
    room: "Senator Burns Building NN906",
    dates: "Sep 1 – Dec 17, 2026",
    sessions: [
      { days: "M/W", time: "8:00 – 9:50 AM" },
      { days: "T/Th", time: "12:00 – 1:50 PM" }
    ]
  },
  {
    title: "The SAIT Experience",
    code: "Academic Upgrading 100 · Section BA2 · CRN 22800",
    type: "async",
    instructor: "Shauna Issler",
    room: "Online · ONLINE30",
    dates: "Aug 17 – Dec 17, 2026",
    sessions: []
  },
  {
    title: "LaunchPad – School of Business",
    code: "Orientation 001 · Section LA · CRN 22781",
    type: "async",
    instructor: "No assigned instructor",
    room: "Online · ONLINE45",
    dates: "Aug 3, 2026 – Apr 29, 2028",
    sessions: []
  },
  {
    title: "Orientation",
    code: "Orientation 118 · Section LA1 · CRN 22666",
    type: "inperson",
    instructor: "No assigned instructor",
    room: "Senator Burns Building NN105",
    dates: "Aug 26, 2026 only",
    sessions: [
      { days: "Wed Aug 26", time: "9:45 AM – 3:50 PM" }
    ]
  }
];

const badges = {
  inperson: { cls: "badge-inperson", label: "In person" },
  online:   { cls: "badge-online",   label: "Online sync" },
  async:    { cls: "badge-async",    label: "Asynchronous" }
};

function renderCards(list) {
  const grid = document.getElementById("grid");
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No classes match this filter.</div>';
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">${c.title}</div>
          <div class="card-code">${c.code}</div>
        </div>
        <span class="badge ${badges[c.type].cls}">${badges[c.type].label}</span>
      </div>
      <div class="divider"></div>
      <div class="detail"><i class="ti ti-user"></i>${c.instructor}</div>
      <div class="detail"><i class="ti ti-map-pin"></i>${c.room}</div>
      <div class="detail"><i class="ti ti-calendar"></i>${c.dates}</div>
      ${c.sessions.length
        ? `<div class="divider"></div>
           <div class="detail"><i class="ti ti-clock"></i>
             <div class="times">${c.sessions.map(s =>
               `<span class="time-chip">${s.days} &middot; ${s.time}</span>`
             ).join("")}</div>
           </div>`
        : `<div class="detail" style="font-style:italic;color:var(--text-muted)">
             <i class="ti ti-clock"></i>Self-paced, no fixed times
           </div>`
      }
    </div>
  `).join("");
}

function filter(type, btn) {
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  renderCards(type === "all" ? courses : courses.filter(c => c.type === type));
}

renderCards(courses);
</script>
</body>
</html>
