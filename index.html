<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIT Legal Assistant — Fall 2026 Schedule</title>
  <meta property="og:title" content="SAIT Legal Assistant — Fall 2026 Schedule" />
  <meta property="og:description" content="Weekly class timetable for Block A and Block C — days, times, and rooms at a glance." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vjstark.github.io/sait-legal-assistant/" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0d8;
      --border-strong: #c8c5bb;
      --text-primary: #1a1916;
      --text-secondary: #6b6860;
      --text-muted: #9e9b93;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --accent-text: #1d4ed8;
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --warning-bg: #fffbeb;
      --warning-text: #92400e;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --danger-border: #fca5a5;
      --radius: 8px;
      --today-tint: rgba(37, 99, 235, 0.06);

      --c1-bg: #dbeafe; --c1-border: #3b82f6; --c1-text: #1e40af;
      --c2-bg: #ede9fe; --c2-border: #8b5cf6; --c2-text: #5b21b6;
      --c3-bg: #d1fae5; --c3-border: #10b981; --c3-text: #065f46;
      --c4-bg: #fef3c7; --c4-border: #f59e0b; --c4-text: #92400e;
      --c5-bg: #fce7f3; --c5-border: #ec4899; --c5-text: #9d174d;
      --c6-bg: #e2e8f0; --c6-border: #64748b; --c6-text: #334155;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --border: #2e2d2a;
        --border-strong: #3d3c38;
        --text-primary: #f0ede6;
        --text-secondary: #9e9b93;
        --text-muted: #6b6860;
        --accent: #3b82f6;
        --accent-bg: #1e3a5f;
        --accent-text: #93c5fd;
        --success-bg: #052e16;
        --success-text: #86efac;
        --warning-bg: #1c1400;
        --warning-text: #fcd34d;
        --danger-bg: #2a1212;
        --danger-text: #fca5a5;
        --danger-border: #7f1d1d;
        --today-tint: rgba(59, 130, 246, 0.10);

        --c1-bg: #1e3a5f; --c1-border: #3b82f6; --c1-text: #93c5fd;
        --c2-bg: #2e1065; --c2-border: #8b5cf6; --c2-text: #c4b5fd;
        --c3-bg: #052e16; --c3-border: #10b981; --c3-text: #86efac;
        --c4-bg: #1c1400; --c4-border: #f59e0b; --c4-text: #fcd34d;
        --c5-bg: #3b0a2a; --c5-border: #ec4899; --c5-text: #f9a8d4;
        --c6-bg: #1e293b; --c6-border: #64748b; --c6-text: #cbd5e1;
      }
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1.75rem 1rem 4rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.1rem;
    }

    .topbar h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .topbar p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .topbar p b { color: var(--accent-text); font-weight: 700; }

    .block-switcher-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .block-switcher-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .block-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .block-pill {
      font-weight: 800;
      font-size: 14px;
      padding: 9px 20px;
      border-width: 2px;
    }

    .block-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 14px -6px var(--accent);
    }

    .alt-schedule-link {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 11.5px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 0;
      text-align: right;
    }

    .alt-schedule-link:hover { color: var(--accent-text); }
    .alt-schedule-link b { color: var(--text-secondary); font-weight: 700; }
    .alt-schedule-link:hover b { color: var(--accent-text); }

    .stats-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-chip i { font-size: 14px; }
    .stat-chip b { color: var(--text-primary); font-weight: 700; }

    .now-chip {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    .term-chip {
      background: var(--warning-bg);
      border-color: var(--warning-text);
      color: var(--warning-text);
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (min-width: 960px) {
      .layout { grid-template-columns: 1.4fr 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 10px 28px -18px rgba(0, 0, 0, 0.18);
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 0.9rem;
    }

    .timetable-panel .panel-title { margin-bottom: 0.9rem; }

    /* Empty block state */
    .empty-block-note {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      color: var(--text-secondary);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      margin-bottom: 1.5rem;
    }

    .empty-block-note i { font-size: 16px; flex-shrink: 0; }

    /* One-time event banner */
    .onetime-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--c6-bg);
      border: 1px solid var(--c6-border);
      color: var(--c6-text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 1.5rem;
    }

    .onetime-banner i { font-size: 16px; flex-shrink: 0; }
    .onetime-banner b { font-weight: 600; }

    /* Conflict banner */
    .conflict-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 0.85rem;
    }

    .conflict-banner i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

    /* Timetable */
    .tt-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .tt-grid { min-width: 640px; }

    .tt-header {
      display: grid;
      grid-template-columns: 52px repeat(5, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .tt-header-cell {
      padding: 8px 6px;
      text-align: center;
      color: var(--text-secondary);
    }

    .tt-day-name { font-size: 12px; font-weight: 600; }
    .tt-day-date { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

    .tt-header-cell.today {
      background: var(--today-tint);
      color: var(--accent-text);
      border-radius: 6px 6px 0 0;
    }

    .tt-header-cell.today .tt-day-date { color: var(--accent-text); opacity: 0.85; }

    .tt-body {
      display: grid;
      grid-template-columns: 52px repeat(5, 1fr);
      position: relative;
    }

    .tt-hours {
      position: relative;
    }

    .tt-hour-label {
      position: absolute;
      left: 0;
      right: 6px;
      text-align: right;
      font-size: 10px;
      color: var(--text-muted);
      transform: translateY(-6px);
    }

    .tt-day-col {
      position: relative;
      border-left: 1px solid var(--border);
      background-image: repeating-linear-gradient(
        to bottom,
        var(--border) 0,
        var(--border) 1px,
        transparent 1px,
        transparent 60px
      );
    }

    .tt-day-col.today { background-color: var(--today-tint); }

    .tt-event {
      position: absolute;
      border-radius: 6px;
      border: 1px solid;
      padding: 4px 6px;
      font-size: 11px;
      line-height: 1.3;
      overflow: hidden;
      cursor: pointer;
      transition: filter 0.1s;
    }

    .tt-event:hover, .tt-event:active { filter: brightness(1.08); }

    .tt-event .tt-event-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tt-event .tt-event-time {
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tt-event .tt-event-room {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tt-event.dimmed { opacity: 0.25; }

    .tt-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 0.85rem;
    }

    .tt-legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .tt-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid;
      flex-shrink: 0;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      font-family: inherit;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .pill.active {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .class-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .class-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-strong);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .class-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .class-row-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .class-row-code {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .class-row-meta {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 600;
    }

    .badge-inperson { background: var(--success-bg); color: var(--success-text); }
    .badge-online   { background: var(--accent-bg);  color: var(--accent-text); }
    .badge-async    { background: var(--warning-bg);  color: var(--warning-text); }

    .class-row-sessions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .time-chip {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 10.5px;
      color: var(--text-primary);
    }

    .time-chip b { color: var(--accent-text); }

    .chip-room {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .chip-room i { font-size: 11px; color: var(--accent-text); }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .topbar h1 { font-size: 19px; }
      .block-switcher-wrap { align-items: flex-start; }
    }

    /* Event detail modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay[hidden] { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 380px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      line-height: 1;
      border-radius: 8px;
    }

    .modal-close i { font-size: 20px; display: block; }
    .modal-close:hover { background: var(--bg); color: var(--text-primary); }

    .modal-title { font-size: 18px; font-weight: 800; margin-top: 10px; line-height: 1.3; }
    .modal-code { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    .modal-detail {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13.5px;
      color: var(--text-primary);
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .modal-detail:first-of-type { margin-top: 14px; }
    .modal-detail i { font-size: 17px; margin-top: 2px; flex-shrink: 0; color: var(--accent-text); }
    .modal-detail b { font-weight: 700; }

    .modal-detail-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .modal-where-callout {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
      text-align: center;
    }

    .modal-where-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-text);
      margin-bottom: 6px;
    }

    .modal-room-big {
      font-size: 30px;
      font-weight: 800;
      color: var(--accent-text);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .modal-building {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div>
      <h1>Legal Assistant — Fall 2026 Schedule</h1>
      <p id="subtitle">Southern Alberta Institute of Technology &middot; Sep 1 – Dec 17, 2026</p>
    </div>
    <div class="block-switcher-wrap">
      <div class="block-switcher-label">Viewing schedule for</div>
      <div class="block-switcher" id="block-switcher"></div>
      <button class="alt-schedule-link" id="alt-schedule-link"></button>
    </div>
  </header>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-chip now-chip" id="now-chip"><i class="ti ti-calendar-time"></i></div>
    <div class="stat-chip term-chip" id="term-chip" hidden><i class="ti ti-info-circle"></i></div>
    <div class="stat-chip"><i class="ti ti-book"></i><b id="stat-total">0</b> classes</div>
    <div class="stat-chip"><i class="ti ti-map-pin"></i><b id="stat-inperson">0</b> in person</div>
    <div class="stat-chip"><i class="ti ti-wifi"></i><b id="stat-online">0</b> online sync</div>
    <div class="stat-chip"><i class="ti ti-clock-pause"></i><b id="stat-async">0</b> asynchronous</div>
  </div>

  <div id="onetime-container"></div>
  <div id="empty-block-container"></div>

  <div class="layout">
    <section class="panel timetable-panel">
      <div class="panel-title">Weekly schedule</div>
      <div id="conflict-container"></div>
      <div class="tt-scroll">
        <div class="tt-grid" id="tt-grid"></div>
      </div>
      <div class="tt-legend" id="tt-legend"></div>
    </section>

    <section class="panel">
      <div class="panel-title-row">
        <div class="panel-title">All classes</div>
        <div class="filters">
          <button class="pill active" onclick="filter('all', this)">All</button>
          <button class="pill" onclick="filter('inperson', this)">In person</button>
          <button class="pill" onclick="filter('online', this)">Online</button>
          <button class="pill" onclick="filter('async', this)">Async</button>
        </div>
      </div>
      <div class="class-list" id="grid"></div>
    </section>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden onclick="if (event.target === this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">
      <i class="ti ti-x"></i>
    </button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const DAY_FULL = { M: "Mon", T: "Tue", W: "Wed", Th: "Thu", F: "Fri" };
const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri"];

const badges = {
  inperson: { cls: "badge-inperson", label: "In person" },
  online:   { cls: "badge-online",   label: "Online sync" },
  async:    { cls: "badge-async",    label: "Asynchronous" }
};

const SCHEDULE = {

      },
      {
        title: "Grammar and Proofreading",

          { days: "W", time: "12:00 – 2:50 PM", room: "Stan Grad Centre MB211" }

      },
      {

        code: "Legal 205 · Section A · CRN 21424",
        type: "online",
        color: "c4",
        instructor: "Jamie Larkam",

function getInitialBlock() {
  try {
    const params = new URLSearchParams(location.search);
    const fromUrl = (params.get("block") || "").toUpperCase();
    if (fromUrl && SCHEDULE[fromUrl]) return fromUrl;
    const stored = localStorage.getItem("block");
    if (stored && SCHEDULE[stored]) return stored;
  } catch (e) {}
  return "A";
}

/* ---------- Event detail modal ---------- */
function parseRoom(room) {
  if (room.includes(" · ")) {
    const [building, roomCode] = room.split(" · ");
    return { building, roomCode };
  }
  const parts = room.trim().split(" ");
  const roomCode = parts.pop();
  const building = parts.join(" ") || room;
  return { building, roomCode };
}

function openEventModal(idx) {
  const ev = currentEvents[idx];
  if (!ev) return;
  const c = ev.course;
  const { building, roomCode } = parseRoom(ev.room);
  document.getElementById("modal-body").innerHTML = `
    <span class="badge ${badges[c.type].cls}">${badges[c.type].label}</span>
    <h2 class="modal-title">${c.title}</h2>

    <div class="modal-where-callout">
      <div class="modal-where-label"><i class="ti ti-map-pin"></i> Where to go</div>
      <div class="modal-room-big">${roomCode}</div>
      <div class="modal-building">${building}</div>

    <div class="modal-detail"><i class="ti ti-clock"></i><div><div class="modal-detail-label">When</div>${DAY_FULL[ev.daysLabel] || ev.daysLabel} &middot; ${ev.time}</div></div>

/* ---------- Live date / term status ---------- */
function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function getTermStatus() {
  const today = startOfDay(new Date());
  if (today < TERM_START) {
    const days = Math.round((TERM_START - today) / 86400000);
    return { inTerm: false, message: `Term starts ${TERM_START.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} — ${days} day${days === 1 ? "" : "s"} away` };
  }
  if (today > TERM_END) {
    return { inTerm: false, message: `Term ended ${TERM_END.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}` };
  }
  return { inTerm: true, message: null };
}

function getWeekDates() {
  const now = new Date();
  const day = now.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const monday = startOfDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset));
  const dates = [];
  for (let i = 0; i < 5; i++) {
    dates.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  return dates;
}

function renderClock() {
  const now = new Date();
  const nowChip = document.getElementById("now-chip");
  if (nowChip) {
    nowChip.innerHTML = `<i class="ti ti-calendar-time"></i> ${now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" })} &middot; <b>${now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</b>`;
  }
  const term = getTermStatus();
  const termChip = document.getElementById("term-chip");
  if (termChip) {
    termChip.hidden = term.inTerm;
    if (!term.inTerm) {
      termChip.innerHTML = `<i class="ti ti-info-circle"></i> ${term.message}`;
    }
  }
}

      altLink.onclick = () => switchBlock("AM");
    }

  const label = SCHEDULE[currentBlock].label;

function switchBlock(block) {
  if (!SCHEDULE[block]) return;
  currentBlock = block;
  currentFilter = "all";
  try { localStorage.setItem("block", block); } catch (e) {}
  try {
    const url = new URL(location.href);
    url.searchParams.set("block", block.toLowerCase());
    history.replaceState(null, "", url);
  } catch (e) {}
  renderAll();
}

/* ---------- Weekly timetable ---------- */
function toMinutes(t) {
  const m = t.trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return null;
  let h = parseInt(m[1], 10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return h * 60 + parseInt(m[2], 10);
}

function parseTimeRange(str) {
  const parts = str.split(/[–—-]/).map(s => s.trim());
  if (parts.length !== 2) return null;
  let [a, b] = parts;
  const aHasPeriod = /AM|PM/i.test(a);
  const bHasPeriod = /AM|PM/i.test(b);
  const bPeriod = (b.match(/AM|PM/i) || [])[0];
  const aPeriod = (a.match(/AM|PM/i) || [])[0];
  if (!aHasPeriod && bHasPeriod) a += " " + bPeriod;
  if (!bHasPeriod && aHasPeriod) b += " " + aPeriod;
  const start = toMinutes(a);
  const end = toMinutes(b);
  if (start === null || end === null) return null;
  return [start, end];
}

function getEvents(courses) {
  const events = [];
  courses.forEach(c => {
    if (c.type === "async" || c.oneTime) return;
    (c.sessions || []).forEach(s => {
      const tokens = s.days.split("/").map(t => t.trim());
      const validDays = tokens.filter(t => t in DAY_MAP);
      if (!validDays.length) return;
      const range = parseTimeRange(s.time);
      if (!range) return;
      const [start, end] = range;
      validDays.forEach(t => {
        events.push({ course: c, day: DAY_MAP[t], start, end, time: s.time, daysLabel: s.days, room: s.room });
      });
    });
  });
  return events;
}

function layoutDay(dayEvents, conflictClusters) {
  dayEvents.sort((a, b) => a.start - b.start);
  const clusters = [];
  let current = [];
  let currentEnd = -Infinity;
  dayEvents.forEach(ev => {
    if (current.length && ev.start < currentEnd) {
      current.push(ev);
      currentEnd = Math.max(currentEnd, ev.end);
    } else {
      if (current.length) clusters.push(current);
      current = [ev];
      currentEnd = ev.end;
    }
  });
  if (current.length) clusters.push(current);

  clusters.forEach(cluster => {
    const laneEnds = [];
    cluster.forEach(ev => {
      let laneIdx = laneEnds.findIndex(endT => endT <= ev.start);
      if (laneIdx === -1) { laneIdx = laneEnds.length; laneEnds.push(ev.end); }
      else laneEnds[laneIdx] = ev.end;
      ev.lane = laneIdx;
    });
    cluster.forEach(ev => { ev.lanes = laneEnds.length; });
    if (laneEnds.length > 1) conflictClusters.push(cluster);
  });
}

function formatHour(h) {
  const period = h < 12 || h === 24 ? "AM" : "PM";
  let hour12 = h % 12;
  if (hour12 === 0) hour12 = 12;
  return `${hour12} ${period}`;
}

function buildTimetable(courses) {
  const events = getEvents(courses);
  events.forEach((e, i) => { e.idx = i; });
  currentEvents = events;
  const byDay = [[], [], [], [], []];
  events.forEach(e => byDay[e.day].push(e));

  const conflictClusters = [];
  byDay.forEach(dayEvents => layoutDay(dayEvents, conflictClusters));

  const totalMin = END_MIN - START_MIN;
  const bodyHeight = totalMin * PX_PER_MIN;

  const today = new Date();
  const inTerm = getTermStatus().inTerm;
  const todayIdx = inTerm && today.getDay() >= 1 && today.getDay() <= 5 ? today.getDay() - 1 : -1;

  // Header
  const weekDates = getWeekDates();
  const headerHtml = `
    <div class="tt-header">
      <div class="tt-header-cell"></div>
      ${DAY_NAMES.map((d, i) => {
        const dateLabel = weekDates[i].toLocaleDateString("en-US", { month: "short", day: "numeric" });
        const isToday = i === todayIdx;
        return `<div class="tt-header-cell${isToday ? " today" : ""}">
          <div class="tt-day-name">${d}${isToday ? " · Today" : ""}</div>
          <div class="tt-day-date">${dateLabel}</div>
        </div>`;
      }).join("")}
    </div>`;

  // Hour labels
  const hours = [];
  for (let h = START_MIN / 60; h < END_MIN / 60; h++) hours.push(h);
  const hourLabelsHtml = hours.map(h => {
    const top = (h * 60 - START_MIN) * PX_PER_MIN;
    return `<div class="tt-hour-label" style="top:${top}px">${formatHour(h)}</div>`;
  }).join("");

  // Day columns
  const dayColsHtml = byDay.map((dayEvents, dayIdx) => {
    const eventsHtml = dayEvents.map(ev => {
      const top = (ev.start - START_MIN) * PX_PER_MIN;
      const height = Math.max((ev.end - ev.start) * PX_PER_MIN, 30);
      const width = 100 / ev.lanes;
      const left = ev.lane * width;
      return `
        <div class="tt-event"
             data-type="${ev.course.type}"
             onclick="openEventModal(${ev.idx})"
             title="${ev.course.title} · ${DAY_FULL[ev.daysLabel] || ev.daysLabel} ${ev.time} · ${ev.room}"
             style="top:${top}px; height:${height}px; left:calc(${left}% + 2px); width:calc(${width}% - 4px);
                    background: var(--${ev.course.color}-bg); border-color: var(--${ev.course.color}-border); color: var(--${ev.course.color}-text);">
          <div class="tt-event-title">${ev.course.title}</div>
          <div class="tt-event-time">${ev.time}</div>
          <div class="tt-event-room"><i class="ti ti-map-pin"></i> ${ev.room.replace(/^Online · /, "")}</div>
        </div>`;
    }).join("");
    return `<div class="tt-day-col${dayIdx === todayIdx ? " today" : ""}" style="height:${bodyHeight}px">${eventsHtml}</div>`;
  }).join("");

  const bodyHtml = `
    <div class="tt-body">
      <div class="tt-hours" style="height:${bodyHeight}px">${hourLabelsHtml}</div>
      ${dayColsHtml}
    </div>`;

  document.getElementById("tt-grid").innerHTML = headerHtml + bodyHtml;

  // Legend
  const legendCourses = courses.filter(c => !c.oneTime && c.type !== "async");
  document.getElementById("tt-legend").innerHTML = legendCourses.map(c => `
    <div class="tt-legend-item">
      <span class="tt-legend-dot" style="background: var(--${c.color}-bg); border-color: var(--${c.color}-border);"></span>
      ${c.title}
    </div>
  `).join("");

  // Conflict banner
  const conflictContainer = document.getElementById("conflict-container");
  if (conflictClusters.length) {
    const seen = new Set();
    const lines = [];
    conflictClusters.forEach(cluster => {
      const key = cluster.map(e => `${e.course.title}:${e.daysLabel}:${e.time}`).sort().join("|");
      if (seen.has(key)) return;
      seen.add(key);
      const parts = cluster.map(e => `${e.course.title} (<b>${DAY_FULL[e.daysLabel] || e.daysLabel} ${e.time}</b>)`);
      lines.push(parts.join(" overlaps with "));
    });
    conflictContainer.innerHTML = `
      <div class="conflict-banner">
        <i class="ti ti-alert-triangle"></i>
        <span>Possible schedule conflict: ${lines.join("; ")}. Worth double-checking with the registrar in case this is a data entry error or alternating section.</span>
      </div>`;
  } else {
    conflictContainer.innerHTML = "";
  }
}

function renderAll() {
  const courses = SCHEDULE[currentBlock].courses;
  renderBlockSwitcher();
  renderStats(courses);
  renderOneTime(courses);
  renderEmptyState(courses);
  document.querySelectorAll(".filters .pill").forEach((p, i) => p.classList.toggle("active", i === 0));
  renderCards(courses);
  buildTimetable(courses);
}

renderClock();
renderAll();
setInterval(renderClock, 30000);
setInterval(() => { buildTimetable(SCHEDULE[currentBlock].courses); applyFilterDim(); }, 60000);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
